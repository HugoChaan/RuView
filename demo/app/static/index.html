<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RuView 人员监测仪表盘</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0e1a; color: #e0e6ed; min-height: 100vh; }
.header { background: linear-gradient(135deg, #1a1f3a, #0d1225); padding: 20px 30px; border-bottom: 1px solid #2a3050; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 1.4em; color: #4fc3f7; }
.status-badge { padding: 6px 14px; border-radius: 20px; font-size: 0.8em; font-weight: 600; }
.status-online { background: #1b5e20; color: #69f0ae; }
.status-offline { background: #4a1515; color: #ef5350; }

.grid { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: auto auto; gap: 16px; padding: 20px; max-width: 1400px; margin: 0 auto; }

.card { background: #141928; border: 1px solid #2a3050; border-radius: 12px; padding: 20px; }
.card h3 { color: #90a4ae; font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

/* 骨骼画布 */
.skeleton-card { grid-column: 1; grid-row: 1 / 3; }
#skeleton-canvas { width: 100%; height: 400px; background: #0d1225; border-radius: 8px; border: 1px solid #1e2740; }

/* 生命体征 */
.vitals-card { grid-column: 2; }
.vital-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #1e2740; }
.vital-item:last-child { border-bottom: none; }
.vital-label { font-size: 0.9em; color: #78909c; }
.vital-value { font-size: 1.6em; font-weight: 700; }
.vital-unit { font-size: 0.7em; color: #78909c; margin-left: 4px; }
.vital-confidence { font-size: 0.7em; color: #546e7a; }
.bpm-normal { color: #69f0ae; }
.bpm-warning { color: #ffa726; }
.bpm-danger { color: #ef5350; }

/* 状态面板 */
.presence-card { grid-column: 3; grid-row: 1; }
.person-info { margin-bottom: 12px; }
.person-info .label { font-size: 0.8em; color: #546e7a; }
.person-info .value { font-size: 1.2em; font-weight: 600; margin-top: 4px; }
.position-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
.pos-item { background: #0d1225; border-radius: 6px; padding: 8px; text-align: center; }
.pos-item .axis { font-size: 0.7em; color: #546e7a; }
.pos-item .val { font-size: 1.1em; font-weight: 600; color: #4fc3f7; }

/* 告警面板 */
.alerts-card { grid-column: 3; grid-row: 2; }
.alert-item { background: #1a1215; border-left: 3px solid #ef5350; padding: 10px 14px; margin-bottom: 8px; border-radius: 4px; font-size: 0.85em; }
.alert-item.warning { border-left-color: #ffa726; background: #1a1812; }
.alert-time { font-size: 0.7em; color: #546e7a; }
.no-alerts { color: #546e7a; font-style: italic; font-size: 0.85em; }

/* 趋势图 */
.trend-card { grid-column: 2; }
#vitals-chart { width: 100%; height: 180px; background: #0d1225; border-radius: 8px; border: 1px solid #1e2740; }

/* 底部信息 */
.footer { text-align: center; padding: 12px; color: #37474f; font-size: 0.75em; }
</style>
</head>
<body>

<div class="header">
  <h1>🫁 RuView 人员监测仪表盘</h1>
  <span id="status-badge" class="status-badge status-offline">离线</span>
</div>

<div class="grid">
  <!-- 骨骼姿态 -->
  <div class="card skeleton-card">
    <h3>👤 实时骨骼姿态</h3>
    <canvas id="skeleton-canvas" width="400" height="400"></canvas>
  </div>

  <!-- 生命体征 -->
  <div class="card vitals-card">
    <h3>🫁 生命体征</h3>
    <div class="vital-item">
      <div>
        <div class="vital-label">呼吸率</div>
        <div class="vital-confidence" id="br-conf">置信度: --</div>
      </div>
      <div><span class="vital-value bpm-normal" id="br-value">--</span><span class="vital-unit">次/分</span></div>
    </div>
    <div class="vital-item">
      <div>
        <div class="vital-label">心率</div>
        <div class="vital-confidence" id="hr-conf">置信度: --</div>
      </div>
      <div><span class="vital-value bpm-normal" id="hr-value">--</span><span class="vital-unit">BPM</span></div>
    </div>
    <div class="vital-item">
      <div>
        <div class="vital-label">信号质量</div>
      </div>
      <div><span class="vital-value" id="sig-value" style="color:#4fc3f7">--</span><span class="vital-unit">%</span></div>
    </div>
    <div class="vital-item">
      <div>
        <div class="vital-label">运动评分</div>
      </div>
      <div><span class="vital-value" id="motion-value" style="color:#ab47bc">--</span></div>
    </div>
  </div>

  <!-- 趋势图 -->
  <div class="card trend-card">
    <h3>📈 体征趋势 (60秒)</h3>
    <canvas id="vitals-chart" width="400" height="180"></canvas>
  </div>

  <!-- 存在状态 -->
  <div class="card presence-card">
    <h3>📍 人员状态</h3>
    <div class="person-info">
      <div class="label">检测人数</div>
      <div class="value" id="person-count">--</div>
    </div>
    <div class="person-info">
      <div class="label">主目标置信度</div>
      <div class="value" id="person-conf">--</div>
    </div>
    <div class="person-info">
      <div class="label">区域</div>
      <div class="value" id="person-zone">--</div>
    </div>
    <div class="position-grid">
      <div class="pos-item"><div class="axis">X</div><div class="val" id="pos-x">-</div></div>
      <div class="pos-item"><div class="axis">Y</div><div class="val" id="pos-y">-</div></div>
      <div class="pos-item"><div class="axis">Z</div><div class="val" id="pos-z">-</div></div>
    </div>
  </div>

  <!-- 告警记录 -->
  <div class="card alerts-card">
    <h3>🚨 告警记录</h3>
    <div id="alert-list"><p class="no-alerts">暂无告警</p></div>
  </div>
</div>

<div class="footer">
  RuView WiFi Sensing • 仿真模式 • 数据每 500ms 更新
</div>

<script>
const API_BASE = 'http://localhost:8080';
let brHistory = [];
let hrHistory = [];
const MAX_HISTORY = 60;

// ── 骨骼绘制 ──────────────────────────────────────────────
const canvas = document.getElementById('skeleton-canvas');
const ctx = canvas.getContext('2d');
canvas.width = 400; canvas.height = 400;

const BONES = [
  ['nose','left_eye'], ['nose','right_eye'],
  ['left_eye','left_ear'], ['right_eye','right_ear'],
  ['left_shoulder','right_shoulder'],
  ['left_shoulder','left_elbow'], ['left_elbow','left_wrist'],
  ['right_shoulder','right_elbow'], ['right_elbow','right_wrist'],
  ['left_shoulder','left_hip'], ['right_shoulder','right_hip'],
  ['left_hip','right_hip'],
  ['left_hip','left_knee'], ['left_knee','left_ankle'],
  ['right_hip','right_knee'], ['right_knee','right_ankle'],
];

function drawSkeleton(keypoints) {
  ctx.clearRect(0, 0, 400, 400);
  
  // 背景网格
  ctx.strokeStyle = '#1e2740';
  ctx.lineWidth = 0.5;
  for(let i = 0; i < 400; i += 40) {
    ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,400); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(400,i); ctx.stroke();
  }

  if(!keypoints || keypoints.length === 0) return;
  
  const kpMap = {};
  keypoints.forEach(kp => { kpMap[kp.name] = kp; });

  // 归一化坐标到 canvas
  const xs = keypoints.map(k => k.x);
  const ys = keypoints.map(k => k.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const scale = Math.min(300/(maxX-minX+1), 300/(maxY-minY+1));
  const offX = (400 - (maxX-minX)*scale) / 2 - minX*scale;
  const offY = (400 - (maxY-minY)*scale) / 2 - minY*scale;

  function tx(x) { return x * scale + offX; }
  function ty(y) { return y * scale + offY; }

  // 画骨骼线
  ctx.strokeStyle = '#4fc3f7';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = '#4fc3f7';
  ctx.shadowBlur = 4;
  BONES.forEach(([a,b]) => {
    if(kpMap[a] && kpMap[b]) {
      ctx.beginPath();
      ctx.moveTo(tx(kpMap[a].x), ty(kpMap[a].y));
      ctx.lineTo(tx(kpMap[b].x), ty(kpMap[b].y));
      ctx.stroke();
    }
  });
  ctx.shadowBlur = 0;

  // 画关节点
  keypoints.forEach(kp => {
    ctx.beginPath();
    ctx.arc(tx(kp.x), ty(kp.y), 5, 0, Math.PI * 2);
    ctx.fillStyle = kp.name === 'nose' ? '#ffa726' : '#69f0ae';
    ctx.fill();
  });
}

// ── 趋势图 ──────────────────────────────────────────────
const chartCanvas = document.getElementById('vitals-chart');
const chartCtx = chartCanvas.getContext('2d');
chartCanvas.width = 400; chartCanvas.height = 180;

function drawChart() {
  chartCtx.clearRect(0, 0, 400, 180);
  chartCtx.strokeStyle = '#1e2740';
  chartCtx.lineWidth = 0.5;
  for(let y = 0; y < 180; y += 30) {
    chartCtx.beginPath(); chartCtx.moveTo(0,y); chartCtx.lineTo(400,y); chartCtx.stroke();
  }

  if(brHistory.length < 2) return;

  // 呼吸率 (绿线, 范围 0-30)
  chartCtx.strokeStyle = '#69f0ae';
  chartCtx.lineWidth = 2;
  chartCtx.beginPath();
  brHistory.forEach((v, i) => {
    const x = (i / MAX_HISTORY) * 400;
    const y = 180 - (v / 30) * 160;
    i === 0 ? chartCtx.moveTo(x, y) : chartCtx.lineTo(x, y);
  });
  chartCtx.stroke();

  // 心率 (蓝线, 范围 30-120)
  chartCtx.strokeStyle = '#4fc3f7';
  chartCtx.lineWidth = 2;
  chartCtx.beginPath();
  hrHistory.forEach((v, i) => {
    const x = (i / MAX_HISTORY) * 400;
    const y = 180 - ((v - 30) / 90) * 160;
    i === 0 ? chartCtx.moveTo(x, y) : chartCtx.lineTo(x, y);
  });
  chartCtx.stroke();

  // 图例
  chartCtx.font = '11px sans-serif';
  chartCtx.fillStyle = '#69f0ae';
  chartCtx.fillText('呼吸', 10, 14);
  chartCtx.fillStyle = '#4fc3f7';
  chartCtx.fillText('心率', 50, 14);
}

// ── 数据轮询 ──────────────────────────────────────────────
async function fetchData() {
  try {
    const [statusRes, vitalsRes, presenceRes, alertsRes] = await Promise.all([
      fetch(`${API_BASE}/api/status`),
      fetch(`${API_BASE}/api/vitals`),
      fetch(`${API_BASE}/api/presence`),
      fetch(`${API_BASE}/api/alerts?limit=5`),
    ]);
    
    const status = await statusRes.json();
    const vitals = await vitalsRes.json();
    const presence = await presenceRes.json();
    const alerts = await alertsRes.json();

    // 状态
    const badge = document.getElementById('status-badge');
    if(status.ruview_connected) {
      badge.textContent = `在线 · tick ${status.tick}`;
      badge.className = 'status-badge status-online';
    } else {
      badge.textContent = '离线';
      badge.className = 'status-badge status-offline';
    }

    // 生命体征
    const br = vitals.breathing_rate_bpm;
    const hr = vitals.heart_rate_bpm;
    if(br != null) {
      document.getElementById('br-value').textContent = br.toFixed(1);
      document.getElementById('br-conf').textContent = `置信度: ${(vitals.breathing_confidence*100).toFixed(0)}%`;
      brHistory.push(br);
      if(brHistory.length > MAX_HISTORY) brHistory.shift();
    }
    if(hr != null) {
      document.getElementById('hr-value').textContent = hr.toFixed(0);
      document.getElementById('hr-conf').textContent = `置信度: ${(vitals.heartbeat_confidence*100).toFixed(0)}%`;
      const hrEl = document.getElementById('hr-value');
      hrEl.className = hr < 50 ? 'vital-value bpm-warning' : hr > 100 ? 'vital-value bpm-danger' : 'vital-value bpm-normal';
      hrHistory.push(hr);
      if(hrHistory.length > MAX_HISTORY) hrHistory.shift();
    }
    if(vitals.signal_quality != null) {
      document.getElementById('sig-value').textContent = (vitals.signal_quality * 100).toFixed(0);
    }

    // 人员
    document.getElementById('person-count').textContent = presence.count;
    if(presence.persons && presence.persons.length > 0) {
      const p = presence.persons[0]; // 主目标
      document.getElementById('person-conf').textContent = `${(p.confidence * 100).toFixed(0)}%`;
      document.getElementById('person-zone').textContent = p.zone || '--';
      document.getElementById('motion-value').textContent = p.motion_score ? p.motion_score.toFixed(1) : '--';
      if(p.position) {
        document.getElementById('pos-x').textContent = p.position[0].toFixed(1);
        document.getElementById('pos-y').textContent = p.position[1].toFixed(1);
        document.getElementById('pos-z').textContent = p.position[2].toFixed(1);
      }
    }

    // 告警
    const alertDiv = document.getElementById('alert-list');
    if(alerts.alerts && alerts.alerts.length > 0) {
      alertDiv.innerHTML = alerts.alerts.map(a => {
        const cls = a.type.includes('fall') ? '' : 'warning';
        const time = new Date(a.timestamp * 1000).toLocaleTimeString();
        return `<div class="alert-item ${cls}"><strong>${a.type}</strong><br><span class="alert-time">${time}</span></div>`;
      }).join('');
    } else {
      alertDiv.innerHTML = '<p class="no-alerts">暂无告警 ✓ 一切正常</p>';
    }

    // 骨骼：从 sensing/latest 拿 keypoints
    const sensingRes = await fetch(`${API_BASE}/api/status`);
    // 直接从 ruview 拿完整帧（通过 app 转发）
    // 简化：用 presence 里的第一个人来画（需要从 ruview 直接拿 keypoints）
    
    drawChart();

  } catch(e) {
    console.error('Fetch error:', e);
    document.getElementById('status-badge').textContent = '连接失败';
    document.getElementById('status-badge').className = 'status-badge status-offline';
  }
}

// 从 RuView 直接拿骨骼数据
async function fetchSkeleton() {
  try {
    const res = await fetch('http://localhost:3000/api/v1/sensing/latest');
    const data = await res.json();
    if(data.persons && data.persons.length > 0) {
      // 取置信度最高的人
      const best = data.persons.reduce((a,b) => a.confidence > b.confidence ? a : b);
      drawSkeleton(best.keypoints);
    }
  } catch(e) {
    // 如果 ruview 3000 不可达，跳过骨骼渲染
  }
}

// 启动轮询
setInterval(fetchData, 500);
setInterval(fetchSkeleton, 200);
fetchData();
fetchSkeleton();
</script>
</body>
</html>
